name: Rapid Takeoff Engine Fixture QA

on:
  push:
    branches:
      - main
    paths:
      - 'app/**'
      - 'lib/**'
      - 'scripts/engine-fixture-qa.mjs'
      - 'tests/fixtures/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/engine-fixture-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  engine-fixtures:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Wait for exact production SHA
        env:
          EXPECTED_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          SITE="https://blueprint-estimator.vercel.app"

          for attempt in $(seq 1 90); do
            payload=$(curl --silent --show-error --fail --max-time 15 "$SITE/api/build-info" || true)
            live_sha=$(printf '%s' "$payload" | jq -r '.sha // empty' 2>/dev/null || true)

            echo "Attempt $attempt: production SHA=${live_sha:-unavailable}; expected=$EXPECTED_SHA"

            if [ "$live_sha" = "$EXPECTED_SHA" ]; then
              echo "Exact production build is live."
              exit 0
            fi

            sleep 10
          done

          echo "Production never reported the expected release SHA."
          exit 1

      - name: Run known-answer engine fixtures
        run: node scripts/engine-fixture-qa.mjs

      - name: Upload fixture reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rapid-takeoff-engine-fixture-reports
          path: qa-results/
          if-no-files-found: warn
