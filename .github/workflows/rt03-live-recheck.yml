name: ABL-RT-03 Live Recheck

on:
  push:
    branches:
      - dev-rt-abl-04
    paths:
      - 'scripts/engine-fixture-qa.mjs'
      - '.github/workflows/rt03-live-recheck.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-recheck:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Verify ABL-RT-03 production SHA
        shell: bash
        run: |
          set -euo pipefail
          expected="b580127e242bdf39e06f8e0626d5c9dca4de09e2"
          for attempt in $(seq 1 12); do
            payload=$(curl --silent --show-error --fail --max-time 15 https://blueprint-estimator.vercel.app/api/build-info || true)
            live_sha=$(printf '%s' "$payload" | jq -r '.sha // empty' 2>/dev/null || true)
            echo "Attempt $attempt: live=$live_sha expected=$expected"
            if [ "$live_sha" = "$expected" ]; then
              exit 0
            fi
            sleep 5
          done
          exit 1

      - name: Run corrected known-answer production fixtures
        run: node scripts/engine-fixture-qa.mjs

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rt03-corrected-live-recheck
          path: qa-results/
          if-no-files-found: warn
