name: ABL-RT-04 Release Recheck

on:
  push:
    branches:
      - dev-rt-abl-05
    paths:
      - 'scripts/engine-fixture-qa.mjs'
      - '.github/workflows/rt04-release-recheck.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-recheck:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Verify ABL-RT-04 production SHA
        shell: bash
        run: |
          set -euo pipefail
          expected="00855c3634d4569fcfdcc28f2de9d1dd0c9325b7"
          for attempt in $(seq 1 12); do
            payload=$(curl --silent --show-error --fail --max-time 15 https://blueprint-estimator.vercel.app/api/build-info || true)
            live_sha=$(printf '%s' "$payload" | jq -r '.sha // empty' 2>/dev/null || true)
            echo "Attempt $attempt: live=$live_sha expected=$expected"
            if [ "$live_sha" = "$expected" ]; then
              exit 0
            fi
            sleep 5
          done
          exit 1

      - name: Run corrected ABL-RT-04 fixture gate
        run: node scripts/engine-fixture-qa.mjs

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rt04-corrected-release-recheck
          path: qa-results/
          if-no-files-found: warn
